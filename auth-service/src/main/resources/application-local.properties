spring.config.activate.on-profile=local

spring.output.ansi.enabled=always
logging.level.com.wearenavodayan=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=navodayan
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Local JWT configuration; secret is supplied through the environment.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=we-are-navodayan-auth
app.security.jwt.audience=we-are-navodayan-api
app.security.jwt.access-token-minutes=15